server:
  port: ${PORT:8080}

spring:
  application:
    name: employee-management-system
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:employee_db}
      auto-index-creation: true

# OpenAPI / Swagger UI configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

logging:
  level:
    com.kloudspot.ems: DEBUG
    org.springframework.data.mongodb: INFO

# Mongock Database Migration Configuration
mongock:
  migration-scan-package:
    - com.kloudspot.ems.migration
  transactional: false
